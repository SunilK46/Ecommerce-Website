name : React CI/CD

on :
  push :
      branches : 
      - master

jobs :
  deploy : 
    runs-on : ubuntu-latest

    steps :

     - name: checkout Repository
       uses: actions/checkout@v4
       
     - name: copy files to EC2
       uses: appleboy/scp-action@v0.1.7

       with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}

        source: "."
        target: "/home/ec2-user/react-app"

     - name: Execute Deployment Script
       uses: appleboy/ssh-action@v1.0.3

       with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}

     - name: Debug Secrets
       run: |
        echo "Host is set: ${{ secrets.EC2_HOST != '' }}"
        echo "Key is set: ${{ secrets.EC2_KEY != '' }}"
        echo "Host length: ${#${{ secrets.EC2_HOST }}}"
        echo "Key starts with: $(echo '${{ secrets.EC2_KEY }}' | head -c 30)"

        script: |
          cd /home/ec2-user/react-app
          chmod +x deploy.sh
          ./deploy.sh


