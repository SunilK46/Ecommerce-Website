name : React CI/CD

on :
  push :
      branches : 
        -master

jobs :
  deploy : 
    runs-on : ubuntu-latest

    steps :

      -name: checkout Repository
       uses: actions/checkout@v4

      -name: copy files to EC2
       uses: applyboy/scp-action@v0.1.7

       with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}

        source: "."
        target: "/home/ec2-user/react-app"

      -name: Execute Deployment Script
       uses: applyboy/ssh-action@v1.0.3

       with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}

        script: |
          cd /home/ec2-user/react-app
          chmod +x deploy.sh
          ./deploy.sh